<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive study site for PV Fundamentals (TU Delft SET4376)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>PV Fundamentals · interactive study notes</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const s = JSON.parse(localStorage.getItem('pvf.settings.v1') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
